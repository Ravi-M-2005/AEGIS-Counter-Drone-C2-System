server:
  port: ${PORT:${SERVER_PORT:8080}}
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE:classpath:aegis-local.p12}
    key-store-password: ${AEGIS_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: ${SSL_KEY_ALIAS:aegis-local}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:file:./data/aegisdb;DB_CLOSE_ON_EXIT=FALSE}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_SHOW_SQL:false}

aegis:
  jwt:
    secret: ${AEGIS_JWT_SECRET:local-dev-only-change-this-secret-to-a-random-32-byte-minimum-key}
    ttl-minutes: ${AEGIS_JWT_TTL_MINUTES:60}
  cors:
    allowed-origins: ${AEGIS_CORS_ALLOWED_ORIGINS:}

logging:
  level:
    root: INFO
    org.springframework.security: INFO
