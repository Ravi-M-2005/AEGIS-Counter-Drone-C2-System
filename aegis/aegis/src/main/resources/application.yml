server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:aegis-local.p12
    key-store-password: ${AEGIS_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: aegis-local
spring:
  datasource:
    url: jdbc:h2:file:./data/aegisdb;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
aegis:
  jwt:
    secret: ${AEGIS_JWT_SECRET:local-dev-only-change-this-secret-to-a-random-32-byte-minimum-key}
    ttl-minutes: 60
logging:
  level:
    org.springframework.security: INFO
