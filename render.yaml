
services:
  - type: web
    name: aegis-backend
    runtime: docker
    rootDir: aegis/aegis
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: AEGIS_JWT_SECRET
        generateValue: true
      - key: AEGIS_ADMIN_USERNAME
        value: admin
      - key: AEGIS_ADMIN_PASSWORD
        sync: false
      - key: AEGIS_CORS_ALLOWED_ORIGINS
        value: https://aegis-counter-drone-c2-system.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-db
          property: connectionString

databases:
  - name: aegis-db
    databaseName: aegis
    user: aegis_user
    plan: free
